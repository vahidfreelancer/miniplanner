<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160">
  <defs>
    <linearGradient id="mpg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Icon: plan card with task rows + checkmark -->
  <g transform="translate(32,32)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#mpg)"/>
    <!-- top header dot (the "mini" spark) -->
    <circle cx="24" cy="24" r="6" fill="#FFFFFF" opacity="0.95"/>
    <!-- task rows -->
    <rect x="40" y="18" width="36" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="24" y="42" width="52" height="12" rx="6" fill="#FFFFFF" opacity="0.7"/>
    <!-- done row: checkmark in a pill -->
    <rect x="24" y="66" width="52" height="12" rx="6" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="70" cy="72" r="14" fill="#FFFFFF"/>
    <path d="M63.5 72 l4.5 4.5 l8.5 -9" fill="none" stroke="#0E7490" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="98" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1" fill="#111827">
    mini<tspan font-weight="300" fill="#2563EB">-planner</tspan>
  </text>
  <text x="152" y="122" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="3" fill="#6B7280">PLAN · TASK · SHIP</text>
</svg>